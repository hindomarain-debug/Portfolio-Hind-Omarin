<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2f6bff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>

  <!-- decorative circle -->
  <circle cx="650" cy="360" r="260" fill="#0f1b33" stroke="#1d4ed8" stroke-opacity="0.35" stroke-width="2"/>

  <!-- folder -->
  <g filter="url(#shadow)">
    <path d="M110 450h170l30 35h160v150H110z" fill="#172554" stroke="#3b82f6" stroke-width="3"/>
    <path d="M110 485h360v150H110z" fill="#1e3a8a" opacity="0.55"/>
    <rect x="145" y="380" width="110" height="110" rx="12" fill="#15213a" stroke="#315ea8"/>
    <text x="200" y="445" text-anchor="middle" font-family="monospace" font-size="38" fill="#60a5fa">&lt;/&gt;</text>
  </g>

  <!-- main browser card -->
  <g filter="url(#shadow)">
    <rect x="310" y="150" width="650" height="430" rx="24" fill="#0f172a" stroke="#274472" stroke-width="3"/>
    <rect x="310" y="150" width="650" height="52" rx="24" fill="#14213a"/>
    <circle cx="340" cy="176" r="7" fill="#ef4444"/>
    <circle cx="364" cy="176" r="7" fill="#facc15"/>
    <circle cx="388" cy="176" r="7" fill="#22c55e"/>

    <!-- sidebar -->
    <rect x="310" y="202" width="145" height="378" fill="#131c31"/>
    <rect x="330" y="250" width="105" height="34" rx="8" fill="#1d4ed8" opacity="0.45"/>
    <rect x="340" y="262" width="18" height="10" rx="5" fill="#38bdf8"/>
    <rect x="368" y="262" width="50" height="10" rx="5" fill="#3b82f6"/>

    <!-- title -->
    <text x="690" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="64" font-weight="700" fill="#f5f7fa">Projects</text>
    <text x="690" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" letter-spacing="4" fill="#94a3b8">BUILD • CREATE • DEPLOY</text>

    <!-- project cards -->
    <g>
      <rect x="500" y="400" width="125" height="135" rx="14" fill="#172033" stroke="#243047"/>
      <rect x="647" y="400" width="125" height="135" rx="14" fill="#172033" stroke="#243047"/>
      <rect x="794" y="400" width="125" height="135" rx="14" fill="#172033" stroke="#243047"/>

      <rect x="522" y="425" width="80" height="48" rx="8" fill="#203761"/>
      <path d="M535 463l18-20 14 13 13-9 14 16z" fill="#3b82f6" opacity="0.55"/>

      <text x="710" y="468" text-anchor="middle" font-family="monospace" font-size="42" fill="#3b82f6">&lt;/&gt;</text>

      <rect x="833" y="423" width="48" height="74" rx="8" fill="#2563eb"/>
      <rect x="838" y="429" width="38" height="58" rx="4" fill="#111827"/>
      <circle cx="857" cy="491" r="3" fill="#60a5fa"/>

      <rect x="520" y="492" width="80" height="8" rx="4" fill="#334155"/>
      <rect x="520" y="508" width="58" height="8" rx="4" fill="#263449"/>
      <rect x="667" y="492" width="80" height="8" rx="4" fill="#334155"/>
      <rect x="667" y="508" width="58" height="8" rx="4" fill="#263449"/>
      <rect x="814" y="492" width="80" height="8" rx="4" fill="#334155"/>
      <rect x="814" y="508" width="58" height="8" rx="4" fill="#263449"/>
    </g>
  </g>

  <!-- analytics card -->
  <g filter="url(#shadow)">
    <rect x="930" y="235" width="210" height="140" rx="18" fill="#111827" stroke="#274472" stroke-width="2"/>
    <rect x="958" y="265" width="65" height="8" rx="4" fill="#334155"/>
    <rect x="958" y="282" width="45" height="8" rx="4" fill="#263449"/>
    <rect x="985" y="330" width="14" height="28" rx="4" fill="#1d4ed8"/>
    <rect x="1017" y="312" width="14" height="46" rx="4" fill="#2563eb"/>
    <rect x="1049" y="292" width="14" height="66" rx="4" fill="#3b82f6"/>
    <rect x="1081" y="270" width="14" height="88" rx="4" fill="#38bdf8"/>
  </g>

  <!-- checklist card -->
  <g filter="url(#shadow)">
    <rect x="965" y="420" width="175" height="155" rx="18" fill="#111827" stroke="#274472" stroke-width="2"/>
    <circle cx="1000" cy="458" r="14" fill="#2563eb"/>
    <path d="M993 458l5 5 9-11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1025" y="453" width="75" height="8" rx="4" fill="#334155"/>
    <circle cx="1000" cy="500" r="14" fill="#2563eb"/>
    <path d="M993 500l5 5 9-11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1025" y="495" width="75" height="8" rx="4" fill="#334155"/>
    <circle cx="1000" cy="542" r="14" fill="none" stroke="#475569" stroke-width="4"/>
    <rect x="1025" y="537" width="58" height="8" rx="4" fill="#334155"/>
  </g>
</svg>
